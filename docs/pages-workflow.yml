# Publishes the browser edition (web/) to GitHub Pages on every push to main.
# Copy this file to .github/workflows/pages.yml, then in the repository settings set
# Pages → Source: "GitHub Actions".
name: Browser edition (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run setup
      - run: npm run build:web
      - name: Test the built site in Chromium (typical strings, features, UI)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test/browser/run-browser.mjs typical
          node test/browser/run-browser.mjs features
          node test/browser/run-browser.mjs ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
